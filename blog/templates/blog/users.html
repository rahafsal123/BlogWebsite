{% extends 'blog/master.html' %}

{% block title %}Users List{% endblock %}

{% block content %}
<h2>Users List</h2>
<ul>
    {% for user in users %}
        <li><strong>{{ user.username }}</strong> - {{ user.email }}</li>
    {% empty %}
        <li>No users found.</li>
    {% endfor %}
</ul>
{% endblock %}
